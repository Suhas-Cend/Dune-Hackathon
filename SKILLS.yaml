---
name: git-contribution-analysis
description: "Use this skill whenever the user wants to evaluate, score, or report on individual developers' contributions to a Git or GitHub repository — e.g. 'who contributed the most on this repo', 'analyze our team's commits and PRs from last quarter', 'give me a contribution breakdown per developer', 'how much did each engineer actually do', or 'help me prep contribution data for performance reviews'. Also trigger for requests to rank or compare developers, surface overlooked contributors (reviewers, infra/maintenance work), or produce a 'contribution report', 'credits' breakdown, or 'contribution score' — any task that means inspecting commits, pull requests, branches, diffs, or code changes to understand what someone actually contributed. This skill treats commit counts and lines of code as poor proxies for value, weighing code quality, complexity, bug-fixing impact, feature delivery, consistency, and project impact instead — use it whenever someone wants a fair, evidence-based read on 'who did what' rather than a raw activity tally. File changes are permitted only when the user explicitly grants permission to modify files. Do NOT make file changes without permission. Do NOT execute repository changes (commits, merges, rebases, history rewrites) unless explicitly authorized by the user."
compatibility: "Requires read access to the target repository's Git history (a local clone or equivalent). Pull request, review, and CI metadata — e.g. via the GitHub CLI (gh) or the GitHub API — substantially improve grouping and impact analysis but are optional; the skill degrades to commit-only heuristics without them."
---
